<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>403</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f44336;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .box {
      max-width: 500px;
    }
    h1 {
      font-size: 72px;
      margin: 0;
    }
    p {
      font-size: 18px;
    }
    a {
      margin-top: 20px;
      display: inline-block;
      text-decoration: none;
      color: white;
      border: 2px solid white;
      padding: 10px 20px;
      border-radius: 5px;
      transition: background 0.3s;
    }
    a:hover {
      background: white;
      color: #f44336;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>403</h1>
    <p>Akses ditolak!<br>Anda tidak memiliki izin untuk melihat halaman ini!</p>
  </div>
</body>
</html>
