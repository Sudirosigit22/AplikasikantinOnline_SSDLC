<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pesanan Berhasil</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    .container {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 480px;
      width: 100%;
      animation: fadeInUp 0.6s ease-out;
    }
    
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @keyframes bounce {
      0%, 20%, 53%, 80%, 100% {
        transform: translate3d(0,0,0);
      }
      40%, 43% {
        transform: translate3d(0, -20px, 0);
      }
      70% {
        transform: translate3d(0, -10px, 0);
      }
      90% {
        transform: translate3d(0, -4px, 0);
      }
    }
    
    h1 {
      color: #10b981;
      font-size: 28px;
      margin-bottom: 12px;
      font-weight: 600;
    }
    
    h2 {
      font-size: 18px;
      color: #374151;
      margin-bottom: 24px;
      font-weight: 400;
      line-height: 1.5;
    }
    
    .btn-login {
      width: 100%;
      padding: 14px 24px;
      font-size: 16px;
      background-color: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      font-family: 'Poppins', sans-serif;
    }
    
    .btn-login:hover {
      background-color: #2563eb;
    }
    
    .btn-login:active {
      transform: translateY(1px);
    }
    
    /* Mobile Responsive */
    @media (max-width: 768px) {
      body {
        padding: 16px;
      }
      
      .container {
        padding: 32px 24px;
      }
      
      .success-icon {
        font-size: 48px;
        margin-bottom: 12px;
      }
      
      h1 {
        font-size: 24px;
        margin-bottom: 8px;
      }
      
      h2 {
        font-size: 16px;
        margin-bottom: 20px;
      }
      
      .btn-login {
        padding: 12px 20px;
        font-size: 15px;
      }
      
    }
    
    @media (max-width: 480px) {
      .container {
        padding: 24px 20px;
      }
      
      
      h1 {
        font-size: 20px;
      }
      
      h2 {
        font-size: 14px;
      }
      
      .btn-login {
        padding: 10px 16px;
        font-size: 14px;
      }
    }
    
    /* Touch-friendly improvements */
    @media (hover: none) and (pointer: coarse) {
      .btn-login {
        padding: 16px 24px;
        font-size: 16px;
      }
    }
    
  </style>
</head>
<body>

<div class="container">
  <h1>✅ Terima kasih!</h1>
  <h2>Pesanan Anda telah berhasil dikirim</h2>
  <button class="btn-login" onclick="sessionStorage.removeItem('lastPage'); window.location.href='/'">Kembali ke Login</button>
</div>

</body>
</html>
